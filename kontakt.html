<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/my-favicon/site.webmanifest" />
</head>

<body>
    <header>
        <!-- Navigation -->
        <div id="navigation-container"></div>

    </header>
    <main>
        <section class="kontakt-social-section" aria-label="Kontakt und Social Media">

            <!-- Kontaktformular -->
            <div class="kontakt-box">
                <h2>Kontakt</h2>
                <p>Hast du Fragen oder möchtest mir etwas mitteilen? Dann schreib mir doch gerne eine Nachricht!</p>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required aria-required="true">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required aria-required="true">

                    <label for="nachricht">Nachricht:</label>
                    <textarea id="nachricht" name="nachricht" rows="5" required aria-required="true"></textarea>

                    <button type="submit">Absenden</button>
                </form>
            </div>

            <!-- Social Media -->
            <div class="social-media-box">
                <h2>Social Media</h2>
                <p>Folge mir gern auf Instagram!</p>
                <a href="https://www.instagram.com/peislingerin" target="_blank" aria-label="Mein Instagram-Profil">
                    <img src="assets/img/instagram.png" alt="Instagram-Logo">
                </a>
            </div>

            <!-- Blob -->
            <div class="kontakt-blob-container">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFE0B2"
                        d="M36.4,-46.2C49.7,-40.5,64.6,-33.2,69.2,-21.8C73.9,-10.4,68.3,5,62.2,19.1C56.1,33.2,49.5,46.1,39,51.2C28.6,56.2,14.3,53.5,-1.6,55.7C-17.4,57.8,-34.8,64.8,-47.2,60.3C-59.5,55.9,-66.9,40,-65,25.9C-63,11.7,-51.7,-0.7,-46.7,-15C-41.8,-29.3,-43.3,-45.5,-36.6,-53.3C-29.9,-61,-14.9,-60.4,-1.7,-58.1C11.6,-55.7,23.2,-51.8,36.4,-46.2Z"
                        transform="translate(100 100)" />
                </svg>
                <img src="/assets/img/kontakt.jpeg" alt="Isabelle steht bei Sonnenuntergang am Strand">
            </div>
        </section>

    </main>



    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- JavaScript -->
    <script src="/js/components.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/formular.js"></script>
</body>

</html>
