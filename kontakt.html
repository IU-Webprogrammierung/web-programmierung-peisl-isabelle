<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <!-- Navigation -->
        <nav>
            <a href="index.html" aria-label="Gehe zur Startseite">
                <img src="#" alt="Logo">
            </a>
            <ul>
                <li><a href="index.html">Startseite</a></li>
                <li><a href="lebenslauf.html">Lebenslauf</a></li>
                <li><a href="tattoos.html">Tattoos</a></li>
                <li><a href="fernwanderungen.html">Fernwanderungen</a></li>
                <li><a href="kontakt.html" class="active">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Kontaktformular - wird später mit JavaScript umgesetzt-->
        <section aria-labelledby="kontakt">
            <h1 id="kontakt">Kontakt</h1>
            <p>Hast du Fragen oder möchtest mir etwas mitteilen? Dann schreib mir doch gerne eine Nachricht!</p>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required aria-required="true">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required aria-required="true">

                <label for="nachricht">Nachricht:</label>
                <textarea id="nachricht" name="nachricht" rows="5" required aria-required="true"></textarea>

                <button type="submit">Absenden</button>
            </form>
        </section>

        <!-- Social Media Kanal -->
        <section aria-labelledby="social-media">
            <h1 id="social-media">Social Media</h1>
            <p>Folge mir gern auf Instagram!</p>
            <a href="https://www.instagram.com/peislingerin" target="_blank" aria-label="Mein Instagram-Profil">
                <img src="assets/img/instagram.png" alt="Instagram-Logo">
            </a>
        </section>

    </main>

    <!-- Footer mit copyright-Vermerk, und toten Links zu Impressum und Datenschutz-->
    <footer>
        <div class="footer-content">
            <p>&copy; Isabelle Peisl, 2025</p>
            <ul>
                <li><a href="#">Impressum</a></li>
                <li><a href="#">Datenschutz</a></li>
            </ul>
        </div>
    </footer>
</body>
