    <main>
        <!-- Kontaktformular - wird später mit JavaScript umgesetzt-->
        <section>
            <h1>Kontakt</h1>
            <p>Hast du Fragen oder möchtest mir etwas mitteilen? Dann schreib mir doch gerne eine Nachricht!</p>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="nachricht">Nachricht:</label>
                <textarea id="nachricht" name="nachricht" rows="5" required></textarea>

                <button type="submit">Absenden</button>
            </form>
        </section>

        <!-- Social Media Kanal -->
        <section>
            <h1>Social Media</h1>
            <p>Folge mir gern auf Instagram!</p>
            <a href="https://www.instagram.com/peislingerin" target="_blank" aria-label="Mein Instagram-Profil">
                <img src="assets/img/instagram.svg" alt="Instagram-Logo">
            </a>
        </section>
